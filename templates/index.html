<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Python Blockchain Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; color: #38bdf8; }
    .subtitle { color: #94a3b8; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    .card h2 {
      margin: 0 0 16px;
      font-size: 18px;
      color: #38bdf8;
    }
    label {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
    }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #0ea5e9; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .block {
      background: #0f172a;
      border: 1px solid #334155;
      border-left: 4px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .block .index {
      font-weight: bold;
      color: #38bdf8;
      font-size: 15px;
    }
    .block .row {
      display: flex;
      margin-top: 6px;
      color: #94a3b8;
    }
    .block .row .label { min-width: 100px; }
    .block .row .value {
      color: #e2e8f0;
      word-break: break-all;
      font-family: monospace;
    }
    .tx {
      margin-top: 8px;
      padding: 8px;
      background: #1e293b;
      border-radius: 4px;
      font-family: monospace;
      color: #a5f3fc;
    }
    #status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
    #status.show { display: block; }
    #status.ok { background: #064e3b; color: #6ee7b7; }
    #status.err { background: #7f1d1d; color: #fca5a5; }
    .valid-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .valid-badge.ok { background: #064e3b; color: #6ee7b7; }
    .valid-badge.bad { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>
  <h1>⛓️ Python Blockchain Explorer</h1>
  <p class="subtitle">Mine blocks, send transactions, inspect the chain</p>

  <div id="status"></div>

  <div class="grid">
    <!-- Left: Actions -->
    <div>
      <div class="card">
        <h2>⛏️ Mine Block</h2>
        <p style="color:#94a3b8;font-size:13px;">
          Runs proof-of-work and appends a new block to the chain.
        </p>
        <button id="mineBtn" onclick="mineBlock()">Mine Block</button>
      </div>

      <div class="card" style="margin-top:20px;">
        <h2>💸 Send Transaction</h2>
        <label>Sender</label>
        <input id="sender" value="alice" />
        <label>Receiver</label>
        <input id="receiver" value="bob" />
        <label>Amount</label>
        <input id="amount" type="number" value="10" />
        <button id="txBtn" onclick="sendTx()">Add Transaction</button>
      </div>
    </div>

    <!-- Right: Chain info -->
    <div>
      <div class="card">
        <h2>
          📊 Chain Status
          <span id="validBadge" class="valid-badge" style="display:none;"></span>
        </h2>
        <div id="chainMeta" style="color:#94a3b8;font-size:13px;">
          Loading...
        </div>
        <button onclick="refresh()" style="margin-top:12px;background:#334155;color:#e2e8f0;">
          🔄 Refresh
        </button>
      </div>
    </div>
  </div>

  <h2 style="color:#38bdf8;">📦 Blocks</h2>
  <div id="chain"></div>

  <script>
    const API = "";

    function showStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "show " + (isError ? "err" : "ok");
      setTimeout(() => el.className = "", 4000);
    }

    async function mineBlock() {
      const btn = document.getElementById("mineBtn");
      btn.disabled = true;
      btn.textContent = "Mining...";
      try {
        const r = await fetch(API + "/mine_block");
        const data = await r.json();
        showStatus(`✅ Block ${data.index} mined! Proof: ${data.proof}`);
        await refresh();
      } catch (e) {
        showStatus("❌ " + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Mine Block";
      }
    }

    async function sendTx() {
      const btn = document.getElementById("txBtn");
      btn.disabled = true;
      btn.textContent = "Sending...";
      const body = {
        sender: document.getElementById("sender").value,
        receiver: document.getElementById("receiver").value,
        amount: Number(document.getElementById("amount").value),
      };
      try {
        const r = await fetch(API + "/add_transaction", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await r.json();
        showStatus("✅ " + data.message);
      } catch (e) {
        showStatus("❌ " + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "Add Transaction";
      }
    }

    async function refresh() {
      try {
        const [chainRes, validRes] = await Promise.all([
          fetch(API + "/get_chain").then(r => r.json()),
          fetch(API + "/is_valid").then(r => r.json()),
        ]);

        document.getElementById("chainMeta").innerHTML = `
          <div>Chain length: <strong style="color:#38bdf8;">${chainRes.length} blocks</strong></div>
          <div>Pending transactions: <strong style="color:#38bdf8;">0</strong></div>
        `;

        const badge = document.getElementById("validBadge");
        badge.style.display = "inline-block";
        badge.textContent = validRes.valid ? "VALID" : "INVALID";
        badge.className = "valid-badge " + (validRes.valid ? "ok" : "bad");

        const container = document.getElementById("chain");
        container.innerHTML = "";
        [...chainRes.chain].reverse().forEach(block => {
          const txs = block.transactions.length
            ? block.transactions.map(t =>
                `<div class="tx">${t.sender} → ${t.receiver}: ${t.amount}</div>`
              ).join("")
            : `<div class="tx" style="color:#64748b;">No transactions</div>`;

          container.innerHTML += `
            <div class="block">
              <div class="index">Block #${block.index}</div>
              <div class="row"><span class="label">Timestamp:</span><span class="value">${new Date(block.timestamp * 1000).toLocaleString()}</span></div>
              <div class="row"><span class="label">Proof:</span><span class="value">${block.proof}</span></div>
              <div class="row"><span class="label">Prev hash:</span><span class="value">${block.previous_hash.slice(0, 24)}...</span></div>
              <div style="margin-top:10px;color:#94a3b8;font-size:12px;">Transactions:</div>
              ${txs}
            </div>
          `;
        });
      } catch (e) {
        document.getElementById("chainMeta").textContent = "❌ " + e.message;
      }
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
